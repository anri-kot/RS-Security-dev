<div th:fragment="resultado" id="resultado-relatorio">
    

    <div th:if="${erro != null}" class="alert alert-danger" th:text="${erro}"></div>

    <div th:if="${relatorio != null && relatorio.total != null}" th:with="vendas=${relatorio.vendas}">
        <div class="row text-center mb-3">
            <div class="col">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <i class="bi bi-cart fs-3 text-primary"></i>
                        <h6 class="mt-2">Total de Vendas</h6>
                        <h4 th:text="${vendas.getTotalElements()}"></h4>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <i class="bi bi-cash-stack fs-3 text-success"></i>
                        <h6 class="mt-2" th:text="'Faturado ' + ${dataInicio == dataFim ? 'Hoje' : 'no período'}">Faturado</h6>
                        <h4>R$ <span th:text="${#numbers.formatDecimal(relatorio.lucroTotal,1,'POINT',2,'COMMA')}"></span></h4>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <i class="bi bi-credit-card fs-3 text-danger"></i>
                        <h6 class="mt-2">Gasto no mês</h6>
                        <h4>R$ <span th:text="${#numbers.formatDecimal(relatorio.monthlyTotal,1,'POINT',2,'COMMA')}"></span></h4>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${relatorio != null && relatorio.total != null}" th:with="vendas=${relatorio.vendas}" class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between">
                <h5 class="card-title">Vendas</h5>
                <h6>Período <span th:text="${relatorio.interval}" class="text-info"></span></h6>
            </div>
            <table class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th></th>
                        <th>Data</th>
                        <th>Receita</th>
                        <th>
                            Média Lucro
                            <i class="bi bi-info-circle"
                                data-bs-toggle="tooltip"
                                data-bs-placement="top"
                                title="A média de lucro é calculada subtraindo a receita da venda pela média de custo dos produtos.">
                            </i>
                        </th>
                        <th class="text-center">%</th>
                        <th>Método</th>
                        <th>Observação</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${vendas}">

                        <td class="text-center">
                            <a th:href="@{/vendas(tipo=idVenda,termo=${v.idVenda})}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-receipt"></i>
                            </a>
                        </td>

                        <td>
                            <span th:text="${#temporals.format(v.data, 'dd/MM/yyyy')}"></span><br>
                            <small class="text-muted" th:text="${#temporals.format(v.data, 'HH:mm')}"></small>
                        </td>
                        
                        <td class="fw-bold text-secondary">
                            R$ <span th:text="${#numbers.formatDecimal(v.liquido,1,'POINT',2,'COMMA')}"></span>
                        </td>

                        <td th:with="lucroVenda=${relatorio.lucroVendas.get(v.idVenda)}" class="fw-bold">
                            <span class="text-success" th:if="${lucroVenda.lucroTotal >= 0}" th:text="'R$ ' + ${#numbers.formatDecimal(lucroVenda.lucroTotal,1,'POINT',2,'COMMA')}"></span>
                            <span class="text-danger" th:if="${lucroVenda.lucroTotal < 0}" th:text="'R$ ' + ${#numbers.formatDecimal(lucroVenda.lucroTotal,1,'POINT',2,'COMMA')}"></span>
                        </td>

                        <td th:with="lucroVenda=${relatorio.lucroVendas.get(v.idVenda)}" class="text-center fw-bold">
                            <span class="text-success" th:if="${lucroVenda.lucroPercentual != null && lucroVenda.lucroPercentual > 0}"
                                th:text="${lucroVenda.lucroPercentualFormatado + '%'}">
                            </span>
                            <span class="text-danger" th:if="${lucroVenda.lucroPercentual != null && lucroVenda.lucroPercentual < 0}"
                                th:text="${lucroVenda.lucroPercentualFormatado + '%'}">
                            </span>
                            
                        </td>
                        
                        <td>
                            <span th:class="${v.metodoPagamento == 'PIX' ? 'badge bg-success' 
                                            : (v.metodoPagamento == 'CARTAO_CREDITO' ? 'badge bg-primary' 
                                            : 'badge bg-secondary')}">
                                <span th:text="${v.metodoPagamento}"></span>
                            </span>
                        </td>
                        
                        <td th:text="${v.observacao ?: '-'}"></td>
                    </tr>
                </tbody>

                <script>
                    // Initializing tooltip
                    document.addEventListener('DOMContentLoaded', function () {
                        const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
                        tooltipTriggerList.map(function (tooltipTriggerEl) {
                            return new bootstrap.Tooltip(tooltipTriggerEl)
                        })
                    });
                </script>
            </table>
            <!-- Page Navigation -->
            <div th:replace="~{fragments/page-nav :: page-nav}"></div>
        </div>
    </div>
</div>
