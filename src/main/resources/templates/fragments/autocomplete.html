<ul th:fragment="options" class="list-group">
    <li th:each="result : ${results}" class="list-group-item list-group-item-action"
        th:data-id-produto="${result.idProduto}" th:data-nome-produto="${result.nome}">
        </small>
        <div class="d-flex flex-nowrap">
            <div class="flex-grow-1 text-truncate">
                <strong th:text="${result.nome}">Produto</strong>
            </div>
            <small class="text-muted ms-2 text-nowrap" th:text="'R$ ' + ${result.precoAtual}"></small>
        </div>
        <p class="m-0 d-flex flex-nowrap">
            <small th:text="'ID ' + ${result.idProduto}"></small>
            <small th:if="${result.codigoBarras != null}" th:text="'COD. BARRAS ' + ${result.codigoBarras}" class="text-truncate d-inline-block"></small>
        </p>
    </li>
</ul>
