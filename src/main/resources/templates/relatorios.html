<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout.html}">

<head>
    <title>Relatórios</title>
</head>

<body>

    <div layout:fragment="content">

        <div class="container py-4" th:fragment="content" data-page-id="relatorios">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="mb-0">Relatórios de Vendas</h1>
                <a th:if="${vendas.totalElements > 0}" th:href="@{/api/venda/export(dataInicio=${start},dataFim=${end})}">
                    <button id="new-compra" class="btn btn-success">Exportar</button>
                </a>
                <a th:unless="${vendas.totalElements > 0}">
                    <button id="new-compra" class="btn btn-success" disabled>Exportar</button>
                </a>          
            </div>

            <div class="card mb-3">
                <div class="card-body">
                    <div class="row g-3 d-flex justify-content-center">
                        <div class="col-6 text-center">
                            <h5>Vendas</h5>
                            <hr>
                            <div>
                                <button class="btn btn-sm btn-outline-primary">Hoje</button>
                                <button class="btn btn-sm btn-outline-primary">Este mês</button>
                                <button class="btn btn-sm btn-outline-primary">Este semestre</button>
                                <button class="btn btn-sm btn-outline-primary">Este ano</button>
                                <button class="btn btn-sm btn-outline-primary">Customizado</button>
                            </div>
                        </div>

                        <div class="col-6 text-center">
                            <h5>Compras</h5>
                            <hr>
                            <button class="btn btn-sm btn-outline-primary">Hoje</button>
                            <button class="btn btn-sm btn-outline-primary">Este mês</button>
                            <button class="btn btn-sm btn-outline-primary">Este semestre</button>
                            <button class="btn btn-sm btn-outline-primary">Este ano</button>
                            <button class="btn btn-sm btn-outline-primary">Customizado</button>
                        </div>
                    </div>

                    <!-- <form hx-get="/relatorios/vendas" hx-target="#resultado-relatorio" hx-swap="innerHTML" hx-push-url="true"
                        class="row g-3">
                        <div class="col-md-4">
                            <label for="start">Data inicial</label>
                            <input type="date" class="form-control" th:value="${start} ?: ''" name="start" required>
                        </div>
                        <div class="col-md-4">
                            <label for="end">Data final</label>
                            <input type="date" class="form-control" th:value="${end} ?: ''" name="end" required>
                        </div>
                        <div class="col-md-4 align-self-end">
                            <button type="submit" class="btn btn-primary">Buscar</button>
                        </div>
                    </form> -->
                </div>
            </div>

            <div th:fragment="resultado" th:replace="~{fragments/relatorio :: resultado}"></div>

            <div class="modal fade" id="relatorioModal" tabindex="-1" aria-labelledby="relatorioModalLabel"
                aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title">Relatório</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                aria-label="Fechar"></button>
                        </div>

                        <div class="modal-body">
                            <h3>Isso é um modal</h3>
                        </div>
                        
                        <div class="modal-footer">
                            <button class="btn btn-danger" data-bs-dismiss="modal">Cancelar</button>
                            <button class="btn btn-success" id="confirm-register"
                                data-action="confirm-modal">Confirmar</button>
                        </div>
                    </div>
                </div>
            </div>


        </div>
    </div>
</body>

</html>
